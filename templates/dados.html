<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus Dados - GineAgenda</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="bg-light py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">GineAgenda</h1>

            <a href="{{ url_for('paciente') }}" class="btn-voltar">Voltar</a>
                Voltar
            </a>
        </div>
    </header>

    <main class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6">

                    <div class="card p-4">

                        <h2 class="text-center mb-4">
                            Meus dados
                        </h2>

                        <div class="mb-3">
                            <strong>Nome:</strong>
                            <span>{{ paciente["nome"] }}</span>
                        </div>

                        <div class="mb-3">
                            <strong>E-mail:</strong>
                            <span>{{ paciente["email"] }}</span>
                        </div>

                        <div class="mb-3">
                            <strong>Telefone:</strong>
                            <span>{{ paciente["telefone"] }}</span>
                        </div>

                        <div class="mb-3">
                            <strong>Data de nascimento:</strong>
                            <span>{{ paciente["data_formatada"] }}</span>
                        </div>
                        <a href="{{ url_for('editar_dados') }}" class="btn btn-primary w-100 mt-3">
    Editar meus dados
</a>
                    </div>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
