<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Dados - GineAgenda</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="bg-light py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">GineAgenda</h1>

            <a href="{{ url_for('dados') }}" class="btn btn-outline-secondary">
                Voltar
            </a>
        </div>
    </header>

    <main class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6">

                    <div class="card p-4">

                        <h2 class="text-center mb-4">
                            Editar meus dados
                        </h2>

                        <form method="POST">

                            <div class="mb-3">
                                <label class="form-label">Nome</label>

                                <input type="text"
                                       class="form-control"
                                       name="nome"
                                       value="{{ paciente['nome'] }}"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">E-mail</label>

                                <input type="email"
                                       class="form-control"
                                       value="{{ paciente['email'] }}"
                                       disabled>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Telefone</label>

                                <input type="text"
                                       class="form-control"
                                       name="telefone"
                                       value="{{ paciente['telefone'] }}"
                                       required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">
                                    Data de nascimento
                                </label>

                                <input type="date"
                                       class="form-control"
                                       name="data_nascimento"
                                       value="{{ paciente['data_nascimento'] }}"
                                       required>
                            </div>

                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Salvar alterações
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
