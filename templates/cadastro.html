<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - GineAgenda</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="bg-light py-3">
        <div class="container">
            <h1 class="h3 mb-0">GineAgenda</h1>
        </div>
    </header>

    <main class="py-5">
        <div class="container">

            <div class="row justify-content-center">
                <div class="col-md-6">

                    <div class="card p-4">

                        <h2 class="text-center mb-4">Cadastro da Paciente</h2>

                       <form method="POST" action="/cadastro">

    <div class="mb-3">
        <label for="nome" class="form-label">Nome completo</label>
        <input type="text"
               class="form-control"
               id="nome"
               name="nome"
               required>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email"
               class="form-control"
               id="email"
               name="email"
               required>
    </div>

    <div class="mb-3">
        <label for="telefone" class="form-label">Telefone</label>
        <input type="tel"
               class="form-control"
               id="telefone"
               name="telefone"
               required>
    </div>

    <div class="mb-3">
        <label for="nascimento" class="form-label">Data de nascimento</label>
        <input type="date"
               class="form-control"
               id="nascimento"
               name="nascimento"
               required>
    </div>

    <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password"
               class="form-control"
               id="senha"
               name="senha"
               required>
    </div>

    <button type="submit" class="btn btn-primary w-100">
        Cadastrar
    </button>

</form>

                        <div class="text-center mt-3">
                            <a href="/">Voltar para o início</a>
                        </div>

                    </div>

                </div>
            </div>

        </div>
    </main>

</body>

</html>
